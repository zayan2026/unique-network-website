<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | Unique Network</title><link rel="stylesheet" href="/style.css"></head><body><div class="auth" style="max-width:900px"><a class="brand" href="/"><div class="logo">UN</div> UNIQUE NETWORK · ADMIN</a><div class="eyebrow">OPERATIONS</div><h1>Administrator dashboard</h1><p>Customer/order management endpoints are provided by the API. Connect the D1 database after deployment.</p><button class="btn" id="logout">Log out</button><div id="msg" class="adminnote"></div></div><script>fetch('/api/admin/me').then(r=>r.json()).then(j=>document.getElementById('msg').textContent=j.name?'Signed in as '+j.name:(j.error||'Please sign in'));document.getElementById('logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.href='/admin/login'};</script></body></html>
