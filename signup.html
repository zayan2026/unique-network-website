<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up | Unique Network</title><link rel="stylesheet" href="/style.css"></head><body><div class="auth"><a class="brand" href="/"><div class="logo">UN</div> UNIQUE NETWORK</a><div class="eyebrow">NEW CUSTOMER</div><h1>Create your account</h1><p>গ্রাহক অ্যাকাউন্ট তৈরি করে নতুন সংযোগের আবেদন করুন।</p><form id="f"><div class="field"><label>Full name</label><input name="name" required minlength="2" placeholder="আপনার নাম"></div><div class="field"><label>Mobile number</label><input name="phone" required pattern="01[0-9]{9}" placeholder="01XXXXXXXXX"></div><div class="field"><label>Address</label><input name="address" required placeholder="গ্রাম / এলাকা, Manikganj"></div><div class="field"><label>Password (8+ characters)</label><input name="password" type="password" required minlength="8"></div><div class="field"><label>Package</label><select name="package" required><option value="">Select a package</option><option>NO Complain 10 Mbps - ৳400</option><option>NO Complain 20 Mbps - ৳450</option><option>NO Complain 2 6 Mbps - ৳400</option><option>Bojro 30 Mbps - ৳500</option><option>Gorjon 35 Mbps - ৳525</option><option>Durbar 40 Mbps - ৳600</option><option>Proloy 50 Mbps - ৳650</option><option>Tornado 60 Mbps - ৳700</option><option>Ghurni 80 Mbps - ৳800</option><option>Jhor 100 Mbps - ৳1000</option><option>Typhoon 120 Mbps - ৳1200</option><option>Thunder 150 Mbps - ৳1500</option></select></div><button class="btn">Create account</button></form><div class="auth-links"><a href="/login">Already registered? Login</a></div><div id="msg" class="adminnote"></div></div><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let r=await fetch('/api/signup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)});let j=await r.json();document.getElementById('msg').textContent=j.message||j.error||'Signup failed';if(r.ok)location.href='/login';};</script><style>select{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:9px;font:inherit}</style></body></html>
