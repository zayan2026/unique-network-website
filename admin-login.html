<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Sign In | Unique Network</title><link rel="stylesheet" href="/style.css"></head><body><div class="auth"><a class="brand" href="/"><div class="logo">UN</div> UNIQUE NETWORK</a><div class="eyebrow">RESTRICTED ACCESS</div><h1>Administrator sign in</h1><p>This portal is for authorized network administrators only.</p><form id="f"><div class="field"><label>Admin mobile</label><input name="phone" value="01819601269" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><button class="btn">Secure sign in</button></form><div id="msg" class="adminnote"></div></div><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)});let j=await r.json();document.getElementById('msg').textContent=j.message||j.error||'Login failed';if(r.ok)location.href='/admin/dashboard';};</script></body></html>
