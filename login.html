<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Login | Unique Network</title><link rel="stylesheet" href="/style.css"></head><body><div class="auth"><a class="brand" href="/"><div class="logo">UN</div> UNIQUE NETWORK</a><div class="eyebrow">CUSTOMER PORTAL</div><h1>Welcome back</h1><p>আপনার গ্রাহক অ্যাকাউন্টে প্রবেশ করুন।</p><form id="f"><div class="field"><label>Mobile number</label><input name="phone" placeholder="01XXXXXXXXX" required pattern="01[0-9]{9}"></div><div class="field"><label>Password</label><input name="password" type="password" placeholder="Your password" required></div><button class="btn">Login to account</button></form><div class="auth-links"><a href="/signup">Create account</a><a href="tel:01819601269">Forgot password? Contact support</a></div><div id="msg" class="adminnote"></div></div><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)});let j=await r.json();document.getElementById('msg').textContent=j.message||j.error||'Login failed';if(r.ok)location.href='/dashboard';};</script></body></html>
