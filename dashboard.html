<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Dashboard | Unique Network</title><link rel="stylesheet" href="/style.css"></head><body><div class="auth"><a class="brand" href="/"><div class="logo">UN</div> UNIQUE NETWORK</a><div class="eyebrow">CUSTOMER DASHBOARD</div><h1>Account overview</h1><p id="info">আপনার অ্যাকাউন্টের তথ্য লোড হচ্ছে…</p><button class="btn" id="logout">Log out</button><div id="msg" class="adminnote"></div></div><script>fetch('/api/me').then(r=>r.json()).then(j=>{document.getElementById('info').innerHTML=j.name?`<b>${j.name}</b><br>Mobile: ${j.phone}<br>Package: ${j.package||'Not selected'}<br>Order/payment status: ${j.status||'Pending'}`:(document.getElementById('info').textContent=j.error||'Please login first');});document.getElementById('logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.href='/login'};</script></body></html>
